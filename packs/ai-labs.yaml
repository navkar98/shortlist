description: >-
  About 100 AI labs and AI-first companies (careers pages, turned into job boards by discovery), plus
  machine-learning searches on NVIDIA, Hugging Face, Mila, Amazon, Meta, and Snap. Checked 2026-10-21.

companies:
  - workday:nvidia.wd5/NVIDIAExternalCareerSite   # NVIDIA
  - workable:huggingface                          # Hugging Face
  - workable:mila-2                               # Mila (Quebec AI Institute)
  - amazon:machine learning                       # Amazon: newest 500 matches per search
  - amazon:applied scientist
  - amazon:research scientist

# Careers pages without a known job board, read with CSS selectors. `render: true` loads the page in a browser.
html_boards:
  - {name: Snap, url: "https://careers.snap.com/jobs", jobs: "tbody tr", link: 'a[href*="/job?id="]',
     title: 'a[href*="/job?id="]', location: "td:last-child"}
  # Meta: one rendered page per search (robots.txt disallows its "cursor" pagination); same name = one identity
  - {name: Meta, url: "https://www.metacareers.com/jobs?q=machine%20learning", jobs: 'a[href*="/profile/job_details/"]',
     title: h3, render: true, max_pages: 1}
  - {name: Meta, url: "https://www.metacareers.com/jobs?q=research%20scientist", jobs: 'a[href*="/profile/job_details/"]',
     title: h3, render: true, max_pages: 1}

